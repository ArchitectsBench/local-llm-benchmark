name: Check results

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  readme-matches-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: README tables match results/
        run: python summarize_results.py --check
